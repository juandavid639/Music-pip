<!doctype html>
<!--
  La barra de Apple Music, sonando un avance. Medida en vivo el 2026-10-08
  (tanda AY) en music.apple.com, en el navegador integrado y SIN CUENTA.

  - Un <audio> de verdad (el avance, del CDN de iTunes) y un <video> que es
    la caratula ANIMADA del album, no la musica.
  - Reproducir y pausar son DOS botones siempre presentes; el que no toca
    lleva aria-hidden="true" (sonando: __play oculto, __pause visible).
  - En avances la barra solo tiene reproducir/pausar y la insignia
    «Avance»: ni siguiente, ni anterior, ni repetir, ni aleatorio.
  - Titulo y artista en marquesinas; cada texto va repetido para el
    desplazamiento. La linea de abajo es «Artista — Album».
  - La caratula va en el srcset del <source> (40 y 80); el src del <img>
    se queda en «/assets/artwork/1x1.gif».
  - El progreso vive en un shadow root (no se copia: se lee del <audio>).
-->
<html lang="es">
  <body>
    <div class="album-header">
      <video class="animated-artwork" src="https://mvod.itunes.apple.com/itunes-assets/animado.m3u8" muted loop></video>
    </div>
    <div data-testid="player-bar" class="player-bar">
      <div data-testid="playback-controls" class="playback-controls">
        <button class="playback-play__play" aria-hidden="true" tabindex="-1"></button>
        <button class="playback-play__pause" aria-label="Pausa"></button>
        <span data-testid="preview-badge" class="preview-badge">Avance</span>
      </div>
      <div data-testid="player-lcd" class="lcd">
        <div data-testid="player-lcd-artwork" class="lcd__artwork">
          <picture>
            <source sizes="40px" srcset="https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/aa/bb/cc/cancion.jpg/40x40bb-60.jpg 40w,https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/aa/bb/cc/cancion.jpg/80x80bb-60.jpg 80w" type="image/jpeg" />
            <img alt="" loading="lazy" src="/assets/artwork/1x1.gif" width="40" height="40" />
          </picture>
        </div>
        <div class="marquee marquee--primary">
          <span data-testid="marquee-text-item">Luz de madrugada</span>
          <span data-testid="marquee-text-item">Luz de madrugada</span>
        </div>
        <div class="marquee marquee--secondary">
          <span data-testid="marquee-text-item">Los Ejemplos</span>
          <span data-testid="marquee-text-item">—</span>
          <span data-testid="marquee-text-item">Canciones de prueba</span>
          <span data-testid="marquee-text-item">Los Ejemplos</span>
          <span data-testid="marquee-text-item">—</span>
          <span data-testid="marquee-text-item">Canciones de prueba</span>
        </div>
      </div>
      <amp-playback-controls-progress></amp-playback-controls-progress>
    </div>
    <audio src="https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview/avance.m4a"></audio>
  </body>
</html>
